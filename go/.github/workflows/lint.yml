name: lint

on:
  push:
    branches: [main]
  pull_request:

# Four packages are entirely skipped (see .golangci.yml's top comment for why): each has a
# _test.go file importing Bazel's gomock-generated mocks via a `mock/github.com/...` importmap
# path that only resolves inside Bazel's build graph, not under plain go vet/golangci-lint's
# go/packages loader -- excluding them from `run`'s package list is the only way to keep the rest
# of the repo lintable without a deeper mock-generation rework.
env:
  GOLANGCI_LINT_VERSION: v2.1.6
  EXCLUDED_PACKAGES_PATTERN: '^github\.com/uber-research/rpcshield/go$|/output$|/genai$|/common/utils$'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for --new-from-rev on pull_request

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Compute lintable package list
        id: pkgs
        run: |
          pkgs=$(go list ./... | grep -vE "${EXCLUDED_PACKAGES_PATTERN}" | sed 's#^github.com/uber-research/rpcshield/go#.#')
          echo "pkgs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$pkgs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # On PRs: only findings on new/changed lines fail the check, so the large pre-existing
      # findings surface (confirmed ~106 at the time this workflow was added) don't block adoption.
      - name: golangci-lint (new issues only)
        if: github.event_name == 'pull_request'
        run: |
          golangci-lint run --new-from-rev="origin/${{ github.base_ref }}" ${{ steps.pkgs.outputs.pkgs }}

      # On pushes to main: run the full lint for visibility, but don't fail the build on
      # pre-existing debt -- only a genuinely broken config/crash should fail this job here.
      - name: golangci-lint (full, informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          golangci-lint run ${{ steps.pkgs.outputs.pkgs }}
